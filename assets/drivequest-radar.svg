<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="DriveQuest hex radar illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c141c"/>
      <stop offset="55%" stop-color="#1a2a38"/>
      <stop offset="100%" stop-color="#3d5568"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a045" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#2bbbad" stop-opacity=".85"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="url(#sky)"/>
  <circle cx="480" cy="70" r="90" fill="#e8a045" opacity=".12" filter="url(#soft)"/>
  <circle cx="120" cy="340" r="110" fill="#2bbbad" opacity=".14" filter="url(#soft)"/>
  <g transform="translate(320 220)">
    <!-- hex rings -->
    <g fill="none" stroke="#9eb4c4" stroke-opacity=".28" stroke-width="1.2">
      <polygon points="0,-95 82,-47.5 82,47.5 0,95 -82,47.5 -82,-47.5"/>
      <polygon points="0,-68 59,-34 59,34 0,68 -59,34 -59,-34"/>
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20"/>
    </g>
    <!-- axes -->
    <g stroke="#9eb4c4" stroke-opacity=".35" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-95"/>
      <line x1="0" y1="0" x2="82" y2="-47.5"/>
      <line x1="0" y1="0" x2="82" y2="47.5"/>
      <line x1="0" y1="0" x2="0" y2="95"/>
      <line x1="0" y1="0" x2="-82" y2="47.5"/>
      <line x1="0" y1="0" x2="-82" y2="-47.5"/>
    </g>
    <!-- scored polygon -->
    <polygon points="0,-78 62,-28 55,32 0,70 -48,28 -58,-34" fill="url(#glow)" fill-opacity=".35" stroke="url(#glow)" stroke-width="2.5"/>
    <g fill="#f3f7fa" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">
      <text text-anchor="middle" x="0" y="-108">Value</text>
      <text text-anchor="start" x="92" y="-47">Budget</text>
      <text text-anchor="start" x="92" y="55">Reliability</text>
      <text text-anchor="middle" x="0" y="118">Efficiency</text>
      <text text-anchor="end" x="-92" y="55">Safety</text>
      <text text-anchor="end" x="-92" y="-47">Practical</text>
    </g>
  </g>
  <text x="36" y="48" fill="#f4f7fa" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">DriveQuest</text>
  <text x="36" y="74" fill="#b7c6d2" font-family="Segoe UI, sans-serif" font-size="13">Conversational car advisor · hex scoring</text>
</svg>