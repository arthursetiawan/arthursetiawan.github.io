<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume — Arthur Setiawan</title>
    <link rel="icon" href="../favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&family=Syne:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #132029;
        --muted: #4d6270;
        --teal: #0f6e63;
        --font-display: "Syne", sans-serif;
        --font-body: "Figtree", sans-serif;
      }
      body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--ink);
        background: linear-gradient(180deg, #f4f8fa, #dce6ee);
        min-height: 100vh;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 1.25rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 auto 0 0;
        font-family: var(--font-display);
        font-size: 1.25rem;
        letter-spacing: -0.03em;
      }
      a {
        color: var(--teal);
        font-weight: 700;
        text-decoration: none;
      }
      .btn {
        display: inline-flex;
        padding: 0.55rem 0.9rem;
        border-radius: 999px;
        background: var(--teal);
        color: #fff;
      }
      .btn-ghost {
        background: rgba(255, 255, 255, 0.7);
        color: var(--ink);
        border: 1px solid rgba(19, 32, 41, 0.12);
      }
      .note {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 0.85rem;
      }
      iframe {
        width: 100%;
        height: min(85vh, 1100px);
        border: 0;
        background: #fff;
        box-shadow: 0 20px 50px rgba(16, 28, 40, 0.14);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <h1>Resume</h1>
        <a class="btn" href="2026_Arthur_Setiawan_Resume.pdf" download>Download PDF</a>
        <a class="btn btn-ghost" href="../index.html">Back to portfolio</a>
      </div>
      <p class="note">Embedded PDF of the current resume.</p>
      <iframe
        title="Arthur Setiawan resume PDF"
        src="2026_Arthur_Setiawan_Resume.pdf"
      ></iframe>
    </div>
  </body>
</html>
